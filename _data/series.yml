# Map series. Entries are listed in reading order; "Part X of Y" is
# computed from position in this list (not from posts' series_order).
#
# Published entry: `post` = the post's permalink (exactly as in its front matter).
#   Title, link and excerpt are read from the post itself.
# Planned entry: `title`, `status: planned`, and `topic` (a name from
#   _data/topics.yml, so /maps/ can list it under "Coming soon").
